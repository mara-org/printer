name: cron-pseo-generate

on:
  schedule:
    - cron: "0 4 * * 1"  # 04:00 UTC every Monday
  workflow_dispatch:
    inputs:
      max:
        description: "Max pages to generate this run"
        required: false
        default: "5"

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    name: generate
    runs-on: ubuntu-latest
    if: github.repository == 'mara-org/printer'
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Generate PSEO pages
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "GEMINI_API_KEY not set as a repo secret; skipping"
            exit 0
          fi
          node scripts/pseo-generate.mjs --max ${{ github.event.inputs.max || '5' }}

      - name: Lint generated JSON via typecheck/build
        run: |
          if git diff --quiet -- data/pseo; then
            echo "no new pages"
            exit 0
          fi
          NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co \
          NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder \
          NEXT_TELEMETRY_DISABLED=1 \
          npm run typecheck

      - name: Open PR with new PSEO pages
        if: success()
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: cron/pseo-${{ github.run_id }}
          base: main
          commit-message: "chore(pseo): generate ${{ github.event.inputs.max || '5' }} new pages"
          title: "PSEO autopilot — new pages"
          body: |
            Automated PSEO generation run.
            Pages generated by Gemini 2.5 Flash, schema-validated.
            Reviewing the diff is recommended for the first few runs; once
            quality is consistent, this PR can be auto-merged.
          add-paths: data/pseo/**
          delete-branch: true
