name: cron-marketing-drafts

on:
  schedule:
    - cron: "0 11 * * *"  # 11:00 UTC daily — drafts ready for morning review
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    name: draft
    runs-on: ubuntu-latest
    if: github.repository == 'mara-org/printer'
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Generate today's drafts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "GEMINI_API_KEY not set as a repo secret; skipping"
            exit 0
          fi
          node scripts/marketing-draft.mjs

      - name: Skip if no new draft
        id: check
        run: |
          if git diff --quiet -- marketing/drafts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR with today's drafts
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: cron/marketing-${{ github.run_id }}
          base: main
          commit-message: "chore(marketing): drafts for $(date -u +%Y-%m-%d)"
          title: "Marketing drafts — Reddit + X"
          body: |
            Daily Reddit + X drafts generated by Gemini.

            **Review checklist:**
            - [ ] Reddit replies match the spirit of the target subreddit (no rules violations)
            - [ ] No fabricated stats or legal advice
            - [ ] X thread tweets each ≤ 280 chars
            - [ ] Mentions of PaperLens read as helpful, not promotional

            Approve to merge into history; copy/paste to post on each platform.
          add-paths: marketing/drafts/**
          delete-branch: true
