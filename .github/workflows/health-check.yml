name: health-check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  TARGET_URL: https://printer-olive.vercel.app

jobs:
  probe:
    name: probe
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/health 3x
        id: probe
        run: |
          set +e
          fails=0
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$TARGET_URL/api/health")
            echo "attempt $i: HTTP $code"
            if [ "$code" != "200" ]; then fails=$((fails+1)); fi
            sleep 10
          done
          echo "fails=$fails" >> "$GITHUB_OUTPUT"
          [ "$fails" -lt 3 ]
      - name: Open issue on 3/3 fail
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = `health-check: ${process.env.TARGET_URL} failing`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "incident",
            });
            if (existing.find(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ["incident", "auto"],
              body: `\`/api/health\` failed 3 consecutive probes.\n\nRun: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}\n\nNext steps:\n1. Check Vercel status\n2. Inspect last deploy at ${process.env.TARGET_URL}\n3. If a recent deploy is the cause, roll back via Vercel dashboard`,
            });
