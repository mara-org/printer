name: pseo-seed

# One-click seed: generate up to 25 PSEO pages and open a single PR.
# Use this on day-1 of the indexing push. After that, the weekly
# `cron-pseo-generate` workflow adds 5 pages a week.

on:
  workflow_dispatch:
    inputs:
      max:
        description: "Pages to seed this run (default 25)"
        required: false
        default: "25"

permissions:
  contents: write
  pull-requests: write

jobs:
  seed:
    name: seed
    runs-on: ubuntu-latest
    if: github.repository == 'mara-org/printer'
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Seed PSEO pages
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "GEMINI_API_KEY not set as a repo secret; skipping"
            exit 0
          fi
          node scripts/pseo-generate.mjs --max ${{ github.event.inputs.max || '25' }}

      - name: Typecheck after generation
        run: |
          if git diff --quiet -- data/pseo; then
            echo "no new pages"
            exit 0
          fi
          NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co \
          NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder \
          NEXT_TELEMETRY_DISABLED=1 \
          npm run typecheck

      - name: Open PR with seed pages
        if: success()
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: pseo/seed-${{ github.run_id }}
          base: main
          commit-message: "feat(pseo): seed ${{ github.event.inputs.max || '25' }} programmatic SEO pages"
          title: "PSEO seed batch — kick off indexing"
          body: |
            One-shot PSEO seed to start indexing. Generated by Gemini 2.5
            Flash, schema-validated, typechecked. Reviewing the first page
            per locale before merging is recommended; once a locale is
            consistent, the weekly `cron-pseo-generate` job carries on.
          add-paths: data/pseo/**
          delete-branch: true
